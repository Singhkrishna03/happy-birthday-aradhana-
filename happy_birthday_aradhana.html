<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday Aradhana 🌸</title>

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5280038806592869"
       crossorigin="anonymous"></script>

  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(to bottom, #fff0f5, #fbeff5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Patrick Hand', cursive;
      overflow: hidden;
    }

    h1 {
      font-size: 3rem;
      color: #c94f7c;
      text-align: center;
      text-shadow: 0 0 20px rgba(255, 182, 193, 0.7);
      animation: glow 3s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px #ffb6c1; }
      to { text-shadow: 0 0 25px #ff69b4; }
    }

    .cake {
      position: relative;
      width: 150px;
      height: 100px;
      background: #ffccd5;
      border-radius: 10px;
      margin-top: 20px;
      box-shadow: 0 0 25px rgba(255, 182, 193, 0.8);
    }

    .candle {
      position: absolute;
      top: -40px;
      left: 65px;
      width: 20px;
      height: 40px;
      background: #fff;
      border-radius: 5px;
      cursor: pointer;
    }

    .flame {
      position: absolute;
      top: -20px;
      left: 5px;
      width: 10px;
      height: 20px;
      background: radial-gradient(circle, gold, orange);
      border-radius: 50%;
      animation: flicker 0.2s infinite;
    }

    @keyframes flicker {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    #wishMessage {
      margin-top: 15px;
      font-size: 1.5rem;
      color: #7b3f61;
      opacity: 0;
      transition: opacity 1s;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      border-radius: 20px;
      background: #c94f7c;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    .note {
      margin-top: 25px;
      font-size: 1.3rem;
      color: #7b3f61;
    }

    .ad-box {
      margin-top: 25px;
      width: 100%;
      max-width: 320px;
      text-align: center;
    }
  </style>
</head>

<body>

  <h1>Happy Birthday Aradhana 🌸</h1>

  <div class="cake">
    <div class="candle" onclick="blowCandle()">
      <div class="flame"></div>
    </div>
  </div>

  <div id="wishMessage">✨ Make a wish, Aradhana! ✨</div>

  <button onclick="releaseWishes()">Click for Surprise 🎁</button>

  <div class="note">
    Like a flower, you bring beauty and light to everyone around you. 🌸
  </div>

  <!-- Google AdSense Ad Unit -->
  <div class="ad-box">
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-5280038806592869"
         data-ad-slot="1234567890"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>
      (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
  </div>

  <script>
    function blowCandle() {
      document.querySelector('.flame').style.display = 'none';
      document.getElementById('wishMessage').style.opacity = 1;
    }

    function releaseWishes() {
      alert("🎉 May all your wishes come true, Aradhana!");
    }
  </script>

</body>
</html>
